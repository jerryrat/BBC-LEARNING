name: Update playlists

# Fetch the BBC RSS feeds every hour and publish the m3u8 files on the `playlists` branch:
#   https://raw.githubusercontent.com/jerryrat/BBC-LEARNING/playlists/<slug>.m3u8
#   https://cdn.jsdelivr.net/gh/jerryrat/BBC-LEARNING@playlists/<slug>.m3u8
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-playlists.mjs"
      - ".github/workflows/playlists.yml"

permissions:
  contents: write

concurrency:
  group: playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (generator)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout playlists branch
        uses: actions/checkout@v4
        with:
          ref: playlists
          path: out
        continue-on-error: true

      - name: Prepare playlists branch on first run
        run: |
          if [ ! -d out/.git ]; then
            rm -rf out && mkdir out && cd out
            git init -q -b playlists
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build playlists
        run: node src/scripts/build-playlists.mjs out

      - name: Commit if anything changed
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new episodes."
            exit 0
          fi
          git commit -q -m "Update playlists $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:playlists
          # Refresh the jsDelivr copy right away (it caches branch files for up to 12 h).
          for f in *.m3u8 index.json; do
            curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${{ github.repository }}@playlists/$f" || true
          done

  # GitHub disables scheduled workflows after 60 days without repository activity.
  # A daily empty commit on `playlists` would not count, so keep the workflow alive via the API.
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -s -X PUT -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/playlists.yml/enable" -o /dev/null -w "%{http_code}\n"
